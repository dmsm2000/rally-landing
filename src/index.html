<!doctype html>
<!-- The head below is the baseline for the Portuguese root. Every locale-dependent tag — title,
     description, canonical, hreflang, og:locale and the social copy — is rewritten per route by
     `Seo`, and prerendering bakes the result into /index.html, /en/index.html and /es/index.html.
     Only tags that are identical in all three languages belong here. -->
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>RALLY — Encontra com quem jogar ténis</title>
  <meta name="description" content="A RALLY é a app social de ténis: encontra parceiros do teu nível, descobre courts e marca o jogo. Zero rankings, zero drama.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242b3d">

  <!-- Open Graph and Twitter Card have to exist as static HTML: the Instagram, WhatsApp, Facebook,
       LinkedIn and X crawlers do not run JavaScript, so they only ever see the prerendered file.
       Image URLs must be absolute — relative paths fail silently in all of them. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RALLY">
  <meta property="og:image" content="https://rallytns.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rallytns.com/assets/og-image.png">

  <link rel="icon" type="image/svg+xml" href="assets/rally-logo-white.svg">
  <!-- Fallback PNG: not every context accepts an SVG favicon, search results among them. -->
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=JetBrains+Mono:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- `sameAs` is what tells Google that the Instagram account and this domain are the same entity.
       When the app ships, add a SoftwareApplication block with the store links. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "RALLY",
    "url": "https://rallytns.com/",
    "logo": "https://rallytns.com/assets/rally-logo-white.svg",
    "image": "https://rallytns.com/assets/og-image.png",
    "email": "hello@rallytns.com",
    "description": "Social tennis app for finding someone to play with, discovering courts and organising the game.",
    "sameAs": ["https://www.instagram.com/rally.tns/"]
  }
  </script>
  <!-- The reveal animations start from opacity:0 and are switched on by JavaScript. Without it the
       page would be blank, so reveal everything up front. -->
  <noscript>
    <style>
      [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
</head>
<body>
  <app-root></app-root>
</body>
</html>
