<footer class="border-t border-border px-5 py-9 sm:px-8 sm:py-12">
  <div class="mx-auto flex max-w-5xl flex-col items-center gap-5 text-center sm:gap-6">
    <div class="flex items-center gap-2">
      <img src="assets/rally-logo-white.svg" alt="" class="size-8" />
      <span class="text-display text-lg">RALLY</span>
    </div>

    <p class="max-w-md text-sm text-muted-foreground">{{ 'footer.tagline' | translate }}</p>

    <a href="mailto:hello@rallytns.com" class="text-eyebrow text-lime hover:underline">{{ 'footer.contact' | translate }}</a>

    <div class="flex flex-col items-center gap-1 pt-4 text-xs text-muted-foreground">
      <p>{{ 'footer.madeWith' | translate }}</p>
      <p>{{ 'footer.rights' | translate: { year } }}</p>
    </div>
  </div>
</footer>
