<a
  [href]="url"
  target="_blank"
  rel="noopener noreferrer"
  [attr.aria-label]="'nav.instagram' | translate"
  class="inline-flex items-center rounded-full border border-border bg-card/70 py-1.5 text-bone backdrop-blur-md transition-colors duration-200 hover:border-lime/50 hover:text-lime"
  [class]="showHandle() ? 'gap-2 px-3' : 'px-1.5'"
>
  <svg
    class="size-4 shrink-0"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="3" width="18" height="18" rx="5.5" />
    <circle cx="12" cy="12" r="4.2" />
    <circle cx="17.2" cy="6.8" r="1.15" fill="currentColor" stroke="none" />
  </svg>
  @if (showHandle()) {
    <span class="text-eyebrow">{{ handle }}</span>
  }
</a>
