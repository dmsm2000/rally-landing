<div class="relative inline-block">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-label]="'nav.language' | translate"
    [attr.aria-expanded]="open()"
    class="flex cursor-pointer items-center gap-1.5 rounded-full border border-border bg-card/70 px-3.5 py-1.5 text-eyebrow text-bone backdrop-blur-md transition-colors duration-200 hover:border-lime/50"
  >
    <img [src]="twemoji.urlFor(flags[i18n.locale()])" alt="" class="size-4 shrink-0" />
    <span>{{ labels[i18n.locale()] }}</span>
    <span class="chevron transition-transform duration-200" [class.chevron--open]="open()" aria-hidden="true">▾</span>
  </button>

  @if (open()) {
    <ul class="no-scrollbar absolute right-0 z-30 mt-1.5 w-24 overflow-hidden rounded-xl border border-border bg-card py-1 leading-none shadow-lg" role="listbox">
      @for (locale of i18n.locales; track locale) {
        <li>
          <button
            type="button"
            (click)="select(locale)"
            role="option"
            [attr.aria-selected]="i18n.locale() === locale"
            class="flex w-full cursor-pointer items-center gap-1.5 px-3 py-1.5 text-left text-xs leading-none transition-colors duration-150"
            [class]="i18n.locale() === locale ? 'text-lime' : 'text-bone hover:bg-muted'"
          >
            <img [src]="twemoji.urlFor(flags[locale])" alt="" class="size-4 shrink-0" />
            <span>{{ labels[locale] }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
