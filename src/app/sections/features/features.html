<section id="features" class="relative mx-auto max-w-6xl py-14 sm:py-24">
  <div class="mb-8 flex flex-col items-center gap-3 px-5 text-center sm:mb-14 sm:px-8">
    <span appRevealOnScroll="scale" class="text-eyebrow text-lime">{{ 'features.eyebrow' | translate }}</span>
    <h2 appRevealOnScroll="rise" class="text-display text-4xl text-bone sm:text-5xl">
      {{ 'features.title' | translate }}
    </h2>
    <p appRevealOnScroll="rise" [style.--reveal-delay]="'0.1s'" class="max-w-md text-muted-foreground">
      {{ 'features.subtitle' | translate }}
    </p>
  </div>

  <!-- Mobile: horizontal snap-scroll strip, peeking the next card. sm+: regular grid.
       No appRevealOnScroll on the cards here: it's a vertical-scroll fade-in, and firing it off
       horizontal drag inside the carousel read as cards flickering while swiping. -->
  <div class="no-scrollbar flex snap-x snap-proximity gap-4 overflow-x-auto px-5 pb-2 scroll-pl-5 sm:grid sm:snap-none sm:gap-5 sm:overflow-visible sm:px-8 sm:pb-0 sm:scroll-pl-0 lg:grid-cols-3">
    @for (f of features; track f.titleKey) {
      <div
        class="feature-card feature-card--{{ f.accent }} group flex w-[78%] shrink-0 snap-start flex-col gap-3 rounded-3xl border border-border bg-card p-6 transition-all duration-300 hover:-translate-y-1.5 sm:w-auto sm:shrink"
      >
        <span class="text-3xl transition-transform duration-300 group-hover:scale-110">{{ f.icon }}</span>
        <h3 class="text-lg font-bold text-bone">{{ f.titleKey | translate }}</h3>
        <p class="text-sm leading-relaxed text-muted-foreground">{{ f.bodyKey | translate }}</p>
      </div>
    }
  </div>
</section>
