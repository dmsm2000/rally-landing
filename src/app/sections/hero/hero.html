<section
  id="top"
  class="relative flex min-h-[100dvh] flex-col items-center justify-center overflow-hidden px-5 pt-24 pb-16 text-center sm:px-8"
  [style.--glow-x.%]="glowX()"
  [style.--glow-y.%]="glowY()"
>
  <div class="hero-glow absolute inset-0" aria-hidden="true"></div>
  <div class="court-grid absolute inset-0 opacity-40" aria-hidden="true"></div>

  <div class="hero-ball-track pointer-events-none absolute inset-x-0 top-[18%] h-0" aria-hidden="true">
    <span class="animate-hop absolute left-0 text-4xl sm:text-5xl">🎾</span>
  </div>

  <span class="animate-float absolute left-[8%] top-[22%] hidden text-3xl opacity-70 sm:block" style="animation-delay: -1.2s" aria-hidden="true">🎾</span>
  <span class="animate-float absolute right-[12%] top-[16%] hidden text-2xl opacity-60 sm:block" style="animation-delay: -3.4s" aria-hidden="true">✈️</span>
  <svg class="animate-float absolute left-[12%] bottom-[18%] hidden size-7 text-bone/40 sm:block" style="animation-delay: -2.1s" viewBox="0 0 24 36" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <ellipse cx="12" cy="10" rx="8" ry="10" />
    <line x1="12" y1="20" x2="12" y2="34" />
    <line x1="9" y1="33" x2="15" y2="33" />
  </svg>
  <svg class="animate-float absolute right-[8%] bottom-[24%] hidden size-8 text-lime/40 sm:block" style="animation-delay: -4.6s" viewBox="0 0 36 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <rect x="2" y="2" width="32" height="20" rx="1" />
    <line x1="18" y1="2" x2="18" y2="22" />
    <line x1="9" y1="6" x2="9" y2="18" />
    <line x1="27" y1="6" x2="27" y2="18" />
    <line x1="9" y1="12" x2="27" y2="12" />
  </svg>

  <div class="relative z-10 flex max-w-3xl flex-col items-center gap-6">
    <span appRevealOnScroll="scale" class="text-eyebrow rounded-full border border-border bg-card/70 px-4 py-1.5 text-lime backdrop-blur-md">
      {{ 'hero.eyebrow' | translate }}
    </span>

    <h1
      appRevealOnScroll="rise"
      [style.--reveal-delay]="'0.1s'"
      class="text-display text-6xl text-bone sm:text-8xl"
    >
      {{ 'hero.title' | translate }}
    </h1>

    <p
      appRevealOnScroll="rise"
      [style.--reveal-delay]="'0.2s'"
      class="max-w-xl text-balance text-lg text-muted-foreground sm:text-xl"
    >
      {{ 'hero.subtitle' | translate }}
    </p>

    <div appRevealOnScroll="rise" [style.--reveal-delay]="'0.3s'" class="mt-2 flex flex-col items-center gap-4 sm:flex-row">
      <a
        [routerLink]="[]"
        fragment="contact"
        class="group relative inline-flex items-center gap-2 overflow-hidden rounded-full bg-lime px-7 py-3.5 text-eyebrow text-ink shadow-lg shadow-lime/20 transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-lime/30"
      >
        <span class="animate-pulse-glow absolute inset-0 -z-10 rounded-full bg-lime blur-xl" aria-hidden="true"></span>
        {{ 'hero.ctaPrimary' | translate }}
        <span aria-hidden="true" class="transition-transform duration-200 group-hover:translate-x-1">→</span>
      </a>

      <a
        [routerLink]="[]"
        fragment="how-it-works"
        class="text-eyebrow inline-flex items-center gap-1.5 rounded-full border border-border px-7 py-3.5 text-bone/80 transition-colors duration-200 hover:border-lime/50 hover:text-lime"
      >
        {{ 'hero.ctaSecondary' | translate }}
        <span aria-hidden="true">↓</span>
      </a>
    </div>
  </div>
</section>
